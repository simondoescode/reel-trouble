<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07182c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reel Trouble">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="manifest" href="/reel-trouble/manifest.webmanifest">
  <link rel="icon" type="image/x-icon" href="./icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="64x64" href="./icons/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="preload" as="image" type="image/webp" href="./assets/title-logo.webp">
  <meta name="description" content="Reel Trouble — an original arcade fishing game. Dive, hook fish, and make a splash.">
  <title>Reel Trouble — Arcade Fishing</title>
</head>
<body>
<div id="rotate-notice" aria-labelledby="rotate-title">
  <div class="rotate-content">
    <div class="rotate-graphic" aria-hidden="true">↻</div>
    <h1 id="rotate-title">Portrait works best</h1>
    <p>Rotate your phone upright to see the whole ocean.</p>
    <button type="button" id="play-landscape">Play anyway</button>
  </div>
</div>
<div id="game-boot" role="status" aria-live="polite">
  <div class="boot-panel">
    <h1>REEL TROUBLE</h1>
    <p id="boot-message">Loading the game…</p>
    <button id="recover-game" type="button" hidden>REFRESH GAME FILES</button>
    <small>Your coins, catches and upgrades will be kept.</small>
  </div>
</div>
<canvas id="game" width="840" height="1560" tabindex="0" role="application" aria-label="Reel Trouble fishing game. Choose tilt or touch steering in Settings, then tap flying fish to shoot them."></canvas>
<link rel="stylesheet" href="./src/styles.css">
<script>
(() => {
 const panel=document.getElementById('game-boot');
 const message=document.getElementById('boot-message');
 const recovery=document.getElementById('recover-game');
 const loadingFailed=(text)=>{
  if(document.body.classList.contains('game-ready'))return;
  message.textContent=text;
  recovery.hidden=false;
  panel.classList.add('failed');
 };
 window.addEventListener('error',()=>loadingFailed('The game failed to start. Refresh game files to retry.'));
 window.addEventListener('unhandledrejection',()=>loadingFailed('The game failed to start. Refresh game files to retry.'));
 window.setTimeout(()=>loadingFailed('Still loading? Refresh the game files to try again.'),6500);
 recovery.addEventListener('click',async()=>{
  recovery.disabled=true;
  message.textContent='Refreshing game files…';
  try{
   const scope=new URL('./',document.baseURI).href;
   if('serviceWorker' in navigator){
    const registrations=await navigator.serviceWorker.getRegistrations();
    await Promise.all(registrations.filter(r=>r.scope===scope).map(r=>r.unregister()));
   }
   if('caches' in window){
    const keys=await caches.keys();
    await Promise.all(keys.filter(k=>k.startsWith('reel-trouble-offline-')).map(k=>caches.delete(k)));
   }
  }catch(_){/* Reload even if this browser restricts cache access. */}
  const fresh=new URL('./',document.baseURI);
  fresh.searchParams.set('reload',String(Date.now()));
  location.replace(fresh.href);
 });
})();
</script>
<script type="module" src="./src/game.js"></script>
</body>
</html>
