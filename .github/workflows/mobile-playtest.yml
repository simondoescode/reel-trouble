name: Mobile gameplay playtest
on:
  push:
    branches: [main, mobile-playtest-v02]
  pull_request:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Run unit and pacing checks
        run: npm run check && npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real canvas touch and game-loop playtests
        run: npm run mobile:smoke
      - name: Save viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-playtest-screenshots
          path: mobile-playtest-artifacts/
          if-no-files-found: ignore
